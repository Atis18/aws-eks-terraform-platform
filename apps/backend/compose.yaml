services:
  postgres:
    image: postgres:17-alpine
    container_name: employee-madness-postgres

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdevonly

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  backend:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.local
    environment:
      PGHOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: