apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-madness-backend
  labels:
    app: employee-madness
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-madness
      component: backend
  template:
    metadata:
      labels:
        app: employee-madness
        component: backend
    spec:
      containers:
        - name: backend
          image: REPLACE_WITH_BACKEND_ECR_IMAGE
          ports:
            - name: http
              containerPort: 3000

          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: employee-madness-backend-config
                  key: PGHOST

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: employee-madness-backend-config
                  key: PGDATABASE

            - name: FIREBASE_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: employee-madness-backend-config
                  key: FIREBASE_PROJECT_ID

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: employee-madness-db
                  key: PGUSER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-madness-db
                  key: PGPASSWORD

          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi