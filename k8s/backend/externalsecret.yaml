apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: employee-madness-db
  namespace: default
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: employee-madness-aws
    kind: SecretStore

  target:
    name: employee-madness-db
    creationPolicy: Owner

  data:
    - secretKey: PGUSER
      remoteRef:
        key: REPLACE_WITH_APP_DB_SECRET_NAME
        property: PGUSER

    - secretKey: PGPASSWORD
      remoteRef:
        key: REPLACE_WITH_APP_DB_SECRET_NAME
        property: PGPASSWORD