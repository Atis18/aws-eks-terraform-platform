apiVersion: v1
kind: Service
metadata:
  name: employee-madness-backend
  labels:
    app: employee-madness
    component: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/ready
spec:
  type: ClusterIP
  selector:
    app: employee-madness
    component: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP