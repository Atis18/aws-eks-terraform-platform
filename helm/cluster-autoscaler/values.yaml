cloudProvider: aws

autoDiscovery:
  clusterName: eks-portfolio-eks

awsRegion: eu-central-1

image:
  tag: v1.36.1

replicaCount: 1

rbac:
  create: true
  serviceAccount:
    create: true
    name: cluster-autoscaler

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    memory: 500Mi