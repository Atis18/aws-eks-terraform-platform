clusterName: eks-portfolio-eks
region: eu-central-1

controllerConfig:
  featureGates:
    ALBGatewayAPI: false
    NLBGatewayAPI: false

replicaCount: 2

serviceAccount:
  create: true
  name: aws-load-balancer-controller

rbac:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  maxUnavailable: 1