name: eks-portfolio-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.sample to .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./apps/backend
    environment:
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: appdb
      PGUSER: appuser
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.sample to .env first}
      PGSSL: "false"
      FIREBASE_PROJECT_ID: ${VITE_FB_projectId:?Set your Firebase project ID in .env}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_FB_apiKey: ${VITE_FB_apiKey:?Set your Firebase web API key in .env}
        VITE_FB_authDomain: ${VITE_FB_authDomain:?Set your Firebase auth domain in .env}
        VITE_FB_projectId: ${VITE_FB_projectId:?Set your Firebase project ID in .env}
        VITE_FB_storageBucket: ${VITE_FB_storageBucket:-}
        VITE_FB_messagingSenderId: ${VITE_FB_messagingSenderId:-}
        VITE_FB_appId: ${VITE_FB_appId:?Set your Firebase web app ID in .env}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
